name: FaceRead-optimized-https-mongodb


on:
  push:
    branches: [main]
    # paths:
    #   - 'faceread4/**'
  pull_request:
    branches: [main]
    # paths:
    #   - 'faceread4/**'

env:
  PROJECT_LOCATION: /opt/applications/faceread4

  PROJECT_NETWORK: faceread-network
  PROJECT_NAME: faceread-api
  IMAGE_NAME: faceread-api

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./faceread4/backend #
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install lint tools
        run: pip install flake8

      - name: Lint app.py et model.py
        run: flake8 app.py model.py --max-line-length=120 --ignore=E501,W503,E402,F401,E302,W291,W292,E303,E226,E265,W293,E261,E262

  build-images:
      runs-on: ubuntu-latest
      needs: lint
      steps:
        - uses: actions/checkout@v5
  
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4
  
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.REGISTRY_USERNAME }}
            password: ${{ secrets.REGISTRY_PASSWORD }}
  
        - name: Build and push API image
          uses: docker/build-push-action@v7
          with:
            context: ./faceread4
            file: ./faceread4/backend/Dockerfile
            push: true
            tags: |
              ${{ secrets.REGISTRY_USERNAME }}/faceread-api:latest
              ${{ secrets.REGISTRY_USERNAME }}/faceread-api:${{ github.sha }}
  
        - name: Build and push frontend image
          uses: docker/build-push-action@v7
          with:
            context: ./faceread4
            file: ./faceread4/frontend/Dockerfile
            push: true
            tags: |
              ${{ secrets.REGISTRY_USERNAME }}/faceread-front:latest
              ${{ secrets.REGISTRY_USERNAME }}/faceread-front:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create remote directory
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} \
              "mkdir -p ${{ env.PROJECT_LOCATION }}"

      - name: Copy compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -P ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ./faceread4/compose.yml \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }}:${{ env.PROJECT_LOCATION }}/compose.yml

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} \
              "docker network inspect ${{ env.PROJECT_NETWORK }} > /dev/null 2>&1 || docker network create ${{ env.PROJECT_NETWORK }} && \
              cd ${{ env.PROJECT_LOCATION }} && \
              docker rm -f faceread-api faceread-front 2>/dev/null || true && \
              docker compose pull && \
              docker compose up -d --remove-orphans"

        # ─────────────────────────────────────
      # 4. Nettoyage des vieilles images Docker
      # ─────────────────────────────────────
      - name: Cleanup old Docker images
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} \
              "docker image prune -a -f && docker builder prune -f"
