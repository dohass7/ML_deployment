# .github/workflows/streamlit-app.yml
name: Deploy Streamlit App

# --- DÉCLENCHEURS ---
on:
  push:
    branches: ["main"]
    paths:
      - 'streamlit/**'       # se déclenche UNIQUEMENT si streamlit/ est modifié
  pull_request:
    branches: ["main"]
    paths:
      - 'streamlit/**'

# --- PERMISSIONS ---
permissions:
  contents: read

# --- JOB PRINCIPAL ---
jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ÉTAPE 1: Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ÉTAPE 2: Configurer Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ÉTAPE 3 (CI): Installer les dépendances depuis streamlit/requirements.txt
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f streamlit/requirements.txt ]; then
            pip install -r streamlit/requirements.txt
          else
            echo "WARNING: streamlit/requirements.txt not found!"
          fi

      # ÉTAPE 4 (CI): Lancer un test de démarrage local
      - name: Run Streamlit locally (CI Test)
        run: |
          timeout 30 streamlit run streamlit/app_streamlit.py --server.headless true --server.port 8080 &
          sleep 10
          curl -f http://localhost:8080/ || exit 1

      # ÉTAPE 5 (CD): Déployer SEULEMENT si on est sur la branche main
      - name: Deploy to Streamlit Community Cloud
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: streamlit/streamlit-app-action@v0.0.3
        with:
          app-path: streamlit/app_streamlit.py
