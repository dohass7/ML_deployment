name: FaceRead

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_LOCATION: /opt/applications/faceread
  PROJECT_NETWORK: faceread-network
  PROJECT_NAME: faceread-api
  IMAGE_NAME: faceread-api

jobs:
  # ─────────────────────────────────────
  # 1. Vérification du code Python
  # ─────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install lint tools
        run: pip install flake8

      - name: Lint app.py et model.py
        run: flake8 app.py model.py --max-line-length=120 --ignore=E501,W503

  # ─────────────────────────────────────
  # 2. Build + push des images Docker
  # ─────────────────────────────────────
  build-images:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ── Image 1 : BACKEND (FastAPI + modèle .h5) ──
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/faceread-api:latest
            ${{ secrets.REGISTRY_USERNAME }}/faceread-api:${{ github.sha }}

      # ── Image 2 : FRONTEND (Nginx + HTML) ──
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_USERNAME }}/faceread-front:latest
            ${{ secrets.REGISTRY_USERNAME }}/faceread-front:${{ github.sha }}

  # ─────────────────────────────────────
  # 3. Déploiement sur le VPS
  # ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create remote directory
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} \
              "mkdir -p ${{ env.PROJECT_LOCATION }}"

      - name: Copy compose.yml
        run: |
          scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -P ${{ secrets.PROD_SERVER_SSH_PORT }} \
              compose.yml \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }}:${{ env.PROJECT_LOCATION }}/compose.yml

      - name: Deploy on VPS
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              -p ${{ secrets.PROD_SERVER_SSH_PORT }} \
              ${{ secrets.PROD_SERVER_USERNAME }}@${{ secrets.PROD_SERVER_ADDRESS }} \
              "docker network inspect ${{ env.PROJECT_NETWORK }} > /dev/null 2>&1 || docker network create ${{ env.PROJECT_NETWORK }} && \
               cd ${{ env.PROJECT_LOCATION }} && \
               docker compose pull && \
               docker compose down && \
               docker compose up -d"
