name: Build & Deploy to EC2

on:
  push:
    branches: ["main"]
    paths:
      - 'streamlit/**'       # se déclenche UNIQUEMENT si streamlit/ est modifié
  pull_request:
    branches: ["main"]
    paths:
      - 'streamlit/**'
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupère le code ────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Configure les credentials AWS ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-north-1

      # ── 3. Login sur ECR ───────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Build + tag + push l'image Docker ──────────────────
      - name: Build, tag and push image to ECR
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: face-emotion-classif
          IMAGE_TAG:      latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./fastapi_frontend
          docker push    $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ── 5. Deploy sur EC2 via SSH ──────────────────────────────
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login ECR depuis l'instance
            aws ecr get-login-password --region eu-north-1 \
              | docker login --username AWS --password-stdin \
                779429483560.dkr.ecr.eu-north-1.amazonaws.com

            # Pull la nouvelle image
            docker pull 779429483560.dkr.ecr.eu-north-1.amazonaws.com/face-emotion-classif:latest

            # Stopper et supprimer l'ancien conteneur
            #docker stop face-emotion-classif || true
            #docker rm   face-emotion-classif || true

            # Lancer le nouveau conteneur
            docker run -d \
              --name face-emotion-classif \
              --restart unless-stopped \
              -p 8000:8000 \
              779429483560.dkr.ecr.eu-north-1.amazonaws.com/face-emotion-classif:latest

            # Nettoyer les anciennes images
            docker image prune -f
